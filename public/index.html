<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>کَلَم | دستیار خرید حضوری ترب</title>
  <meta name="description" content="کَلَم، دستیار خرید حضوری ترب: مقایسه قیمت مغازه‌های پاساژهای تهران، مسیر خرید چندقلمی، آدرس طبقه و واحد و جایگزین فوری مغازه بسته.">
  <link rel="icon" href="./logo.jpg">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <a class="skip-link" href="#view">رفتن به محتوای اصلی</a>

  <header class="site-header" id="site-header">
    <div class="container header-row">
      <a class="brand" href="#/" aria-label="صفحه اصلی کَلَم">
        <img src="./logo.jpg" alt="" class="brand-logo" width="40" height="40">
        <span class="brand-text">
          <span class="brand-name">کَلَم</span>
          <span class="brand-tag">خرید حضوری ترب</span>
        </span>
      </a>

      <form class="search-box header-search" id="header-search" role="search">
        <input type="search" name="q" id="header-search-input" placeholder="نام کالا را وارد کنید" autocomplete="off" aria-label="جستجوی کالا">
        <button type="submit" class="search-box-btn" aria-label="جستجو">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
      </form>

      <div class="header-actions">
        <div class="hub-picker">
          <button type="button" class="header-btn" id="hub-btn" aria-haspopup="listbox" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
            <span id="hub-btn-label">همه مراکز خرید</span>
            <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <ul class="hub-menu" id="hub-menu" role="listbox" hidden></ul>
        </div>
        <a class="header-btn cart-link" href="#/cart" aria-label="سبد خرید حضوری">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6.2"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
          <span class="cart-link-text">سبد حضوری</span>
          <span class="badge-count" id="cart-count" hidden>0</span>
        </a>
      </div>
    </div>

    <nav class="cat-nav" aria-label="دسته‌بندی‌ها">
      <div class="container cat-nav-row" id="cat-nav"></div>
    </nav>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="container footer-row">
      <div class="footer-brand">
        <img src="./logo.jpg" alt="" width="32" height="32">
        <div>
          <strong>کَلَم</strong>
          <p>دستیار خرید حضوری ترب؛ مقایسه قیمت، مسیر خرید و آدرس دقیق مغازه‌ها در پاساژهای تهران.</p>
        </div>
      </div>
      <ul class="footer-links">
        <li><a href="#/about">درباره کَلَم و الگوریتم‌ها</a></li>
        <li><a href="./WHITEPAPER_KALAM.pdf" target="_blank" rel="noopener">وایت‌پیپر (PDF)</a></li>
        <li><a href="#/cart">سبد خرید حضوری</a></li>
      </ul>
    </div>
  </footer>

  <!-- دستیار گفتگو -->
  <button type="button" class="assistant-fab" id="assistant-fab" aria-controls="assistant" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H8l-4 4V5Z"/><path d="M8 10h8M8 13h5"/></svg>
    <span>دستیار کَلَم</span>
  </button>

  <aside class="assistant" id="assistant" aria-label="دستیار کَلَم" hidden>
    <div class="assistant-head">
      <img src="./logo.jpg" alt="" width="32" height="32">
      <div class="assistant-title">
        <strong>دستیار کَلَم</strong>
        <span>پاسخ‌ها فقط از داده‌های فروشگاه‌های ترب</span>
      </div>
      <button type="button" class="icon-btn" data-action="clear-chat" title="پاک کردن گفتگو" aria-label="پاک کردن گفتگو">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
      </button>
      <button type="button" class="icon-btn" data-action="close-assistant" aria-label="بستن دستیار">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="assistant-body" id="chat-messages" aria-live="polite"></div>
    <div class="assistant-prompts" id="chat-prompts"></div>
    <form class="assistant-input" id="chat-form">
      <input type="text" id="chat-input" placeholder="مثلاً: مغازه بسته بود، جایگزین می‌خوام" autocomplete="off" aria-label="پیام به دستیار">
      <button type="submit" class="btn btn-primary" aria-label="ارسال">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12 4 4l3 8-3 8 16-8ZM7 12h6"/></svg>
      </button>
    </form>
  </aside>

  <!-- مودال عمومی -->
  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-action="close-modal"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h2 id="modal-title"></h2>
        <button type="button" class="icon-btn" data-action="close-modal" aria-label="بستن">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>

  <script src="./app.js"></script>
</body>
</html>
